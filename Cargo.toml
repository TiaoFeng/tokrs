[package]
name = "tokrs"
version = "0.3.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/TiaoFeng/tokrs"
description = "A CLI tool for counting tokens"
readme = "README.md"
keywords = ["cli", "token", "tool", "ai"]
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
comfy-table = "8.0.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
